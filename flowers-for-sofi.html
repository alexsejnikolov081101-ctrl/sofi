<html lang="bg">
<head>
<meta charset="utf-8">

<title>Цветя за теб, Софи</title>
<style>
:root{--bg:#fff1f4;--bg2:#ffd9e2;--tx:#4a1f2e;--ac:#e0577a;--card:rgba(255,255,255,.65);--wrap:#f8bbd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1420;--bg2:#4a1f35;--tx:#ffe4ea;--ac:#ff8fab;--card:rgba(0,0,0,.3);--wrap:#8e3a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1420;--bg2:#4a1f35;--tx:#ffe4ea;--ac:#ff8fab;--card:rgba(0,0,0,.3);--wrap:#8e3a5c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 18px;text-align:center;color:var(--tx);background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg) 70%);background-color:var(--bg);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
h1{font-size:clamp(2rem,9vw,3.4rem);margin:0;line-height:1.1;font-weight:400;font-style:italic;color:var(--ac)}
h1 span{display:block;font-size:.5em;font-style:normal;letter-spacing:.2em;text-transform:uppercase;color:var(--tx);opacity:.7;margin-bottom:6px}
p.sub{margin:0;max-width:30ch;font-size:1.05rem;opacity:.85}
svg.b{width:min(78vw,330px);height:auto;filter:drop-shadow(0 12px 18px rgba(224,87,122,.25))}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
.sw:nth-child(2n){animation-delay:-1.2s}.sw:nth-child(3n){animation-delay:-2.4s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
button{font:inherit;font-size:1.05rem;color:#fff;background:var(--ac);border:0;border-radius:999px;padding:14px 28px;cursor:pointer;box-shadow:0 6px 16px rgba(224,87,122,.35)}
button:active{transform:scale(.96)}
.tl{margin:0;font-size:.95rem;opacity:.8;letter-spacing:.04em}
.t{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(92vw,360px)}
.t div{background:var(--card);border-radius:14px;padding:10px 4px}
.t b{display:block;font-size:1.6rem;font-weight:400;color:var(--ac);font-variant-numeric:tabular-nums}
.t small{font-size:.72rem;opacity:.75}
.msg{min-height:3.2em;max-width:28ch;padding:12px 18px;border-radius:18px;background:var(--card);font-size:1.1rem;font-style:italic}
.p{position:fixed;top:-40px;pointer-events:none;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sw{animation:none}.p{display:none}}
.f{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}.f svg{width:min(86vw,360px);height:auto;filter:drop-shadow(0 10px 16px rgba(224,87,122,.3))}.fo{margin:0;font-size:clamp(1.7rem,8vw,2.4rem);font-style:italic;color:var(--ac)}
</style>
</head>
